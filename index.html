<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soareverix</title>
<meta name="description" content="Soareverix: Michael Andrzejewski. Worlds, mods, and AI alignment research, painted in moving light.">
<meta name="theme-color" content="#0b1424">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,200..400;1,9..144,200..400&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('intro');</script>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #0b1424; color: #fff8ee; }
  html.intro, html.intro body { height: 100%; overflow: hidden; }
  html.site-mode { scroll-behavior: smooth; }
  body { font-family: "Fraunces", Georgia, "Times New Roman", serif; -webkit-font-smoothing: antialiased; }

  #app { position: fixed; inset: 0; z-index: 4; }
  #app canvas { display: block; }
  html.site-mode #app { display: none; }

  #art {
    position: fixed; left: 0; top: 0; z-index: 0; display: block;
    width: 100vw; height: 100vh; height: 100lvh;
  }

  /* soft vignette and a whisper of film grain over everything */
  #veil {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: radial-gradient(130% 95% at 50% 45%, transparent 58%, rgba(6, 10, 24, 0.34) 100%);
  }
  #veil::after {
    content: ""; position: absolute; inset: 0; opacity: 0.07; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  #fade { position: fixed; inset: 0; z-index: 6; background: #fff2dc; opacity: 0; pointer-events: none; }

  /* ------------------------------------------------ panels: one painting each, a header and nothing else */
  #site { position: relative; z-index: 2; display: none; }
  html.site-mode #site { display: block; }

  .panel {
    position: relative; box-sizing: border-box; display: flex;
    height: 100vh; height: 100lvh;
    padding: max(11vh, 76px) max(8vw, 24px);
  }
  .panel[data-place="c"]  { align-items: center; justify-content: center; text-align: center; padding-bottom: 22vh; }
  .panel[data-place="tl"] { align-items: flex-start; justify-content: flex-start; }
  .panel[data-place="tc"] { align-items: flex-start; justify-content: center; text-align: center; }
  .panel[data-place="tr"] { align-items: flex-start; justify-content: flex-end; text-align: right; }

  .panel h1, .panel h2 {
    margin: 0; color: #fffaf1; line-height: 1.04;
    text-shadow: 0 1px 2px rgba(10, 16, 34, 0.3), 0 6px 40px rgba(10, 16, 34, 0.45), 0 0 80px rgba(255, 226, 180, 0.35);
    opacity: 0; filter: blur(12px); transform: translateY(26px);
    transition: opacity 1.8s ease, filter 1.8s ease, transform 2.4s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .panel h1 {
    text-shadow: 0 1px 3px rgba(16, 36, 72, 0.4), 0 4px 30px rgba(20, 50, 100, 0.55), 0 0 90px rgba(30, 70, 130, 0.35);
    font-size: clamp(52px, 11vw, 170px); font-weight: 200; letter-spacing: 0.06em; text-indent: 0.06em;
    font-variation-settings: "opsz" 144;
  }
  .panel h2 {
    font-size: clamp(36px, 5.6vw, 84px); font-weight: 300; font-style: italic; max-width: 11ch;
    font-variation-settings: "opsz" 144;
  }
  .panel h2::after {
    content: ""; display: block; height: 1px; margin-top: 0.32em;
    background: linear-gradient(90deg, rgba(255, 240, 216, 0.85), rgba(255, 240, 216, 0));
    transform: scaleX(0); transform-origin: left;
    transition: transform 2.6s 0.5s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .panel[data-place="tc"] h2::after { background: linear-gradient(90deg, rgba(255, 240, 216, 0), rgba(255, 240, 216, 0.85), rgba(255, 240, 216, 0)); transform-origin: center; }
  .panel[data-place="tr"] h2::after { background: linear-gradient(270deg, rgba(255, 240, 216, 0.85), rgba(255, 240, 216, 0)); transform-origin: right; }
  .panel.on h1, .panel.on h2 { opacity: 1; filter: none; transform: none; }
  .panel.on h2::after { transform: scaleX(1); }

  /* a falling bead of light that says "keep going" without words */
  .hint {
    position: absolute; left: 50%; bottom: 7vh; width: 1px; height: 64px; margin-left: -0.5px; overflow: hidden;
    background: linear-gradient(rgba(255, 248, 234, 0), rgba(255, 248, 234, 0.55));
    opacity: 0; transition: opacity 2s 1.6s;
  }
  .panel.on .hint { opacity: 1; }
  .hint::after {
    content: ""; position: absolute; left: -2px; top: -10px; width: 5px; height: 10px; border-radius: 3px;
    background: #fff; box-shadow: 0 0 10px 2px rgba(255, 236, 200, 0.9);
    animation: bead 2.6s cubic-bezier(0.5, 0, 0.5, 1) infinite;
  }
  @keyframes bead { from { transform: translateY(0); } to { transform: translateY(80px); } }

  #dots {
    position: fixed; right: max(14px, env(safe-area-inset-right)); top: 50%; z-index: 7;
    transform: translateY(-50%); display: none; flex-direction: column; gap: 4px;
  }
  html.site-mode #dots { display: flex; }
  #dots a { display: grid; place-items: center; width: 22px; height: 22px; }
  #dots a::before {
    content: ""; width: 6px; height: 6px; border-radius: 3px;
    background: rgba(255, 248, 236, 0.5); box-shadow: 0 0 8px rgba(255, 220, 170, 0.45);
    transition: height 0.6s cubic-bezier(0.2, 0.7, 0.2, 1), background 0.4s, box-shadow 0.4s;
  }
  #dots a:hover::before { background: #fff; }
  #dots a.on::before { height: 20px; background: #fff7ea; box-shadow: 0 0 14px rgba(255, 214, 150, 0.95); }
  #dots a:focus-visible { outline: 1px solid rgba(255, 240, 216, 0.8); border-radius: 6px; }

  @media (prefers-reduced-motion: reduce) {
    .panel h1, .panel h2, .panel h2::after, .hint { transition: none; }
    .hint::after { animation: none; }
  }
</style>
<noscript><style>html.intro, html.intro body { height: auto; overflow: visible; } #site { display: block; } .panel h1, .panel h2 { opacity: 1; filter: none; transform: none; }</style></noscript>
</head>
<body>

<div id="app" aria-hidden="true"></div>
<canvas id="art" aria-hidden="true"></canvas>
<div id="veil" aria-hidden="true"></div>
<div id="fade" aria-hidden="true"></div>
<nav id="dots" aria-label="Sections"></nav>

<main id="site">
  <section id="top" class="panel" data-scene="overlook" data-place="c"><h1>Soareverix</h1><span class="hint" aria-hidden="true"></span></section>
  <section id="staravorix" class="panel" data-scene="forest" data-place="tl"><h2>Staravorix</h2></section>
  <section id="vintage-story" class="panel" data-scene="hills" data-place="tc"><h2>Vintage Story</h2></section>
  <section id="alignment" class="panel" data-scene="lighthouse" data-place="tc"><h2>AI Alignment Research</h2></section>
  <section id="convergence" class="panel" data-scene="stars" data-place="tl"><h2>Convergence</h2></section>
  <section id="ramblings" class="panel" data-scene="sunset" data-place="tc"><h2>Romance and other Ramblings</h2></section>
  <section id="made" class="panel" data-scene="lanterns" data-place="tr"><h2>Things I&rsquo;ve Made</h2></section>
</main>

<script>
// ===================================================================== ART
// Every panel is a painting made at load time on a canvas: static layers are
// painted once per screen size, then a light layer of drifting things (waves,
// leaves, lanterns, stars, a lighthouse beam) is drawn over them each frame.
// One fixed canvas shows the current painting and dissolves into the next as
// the reader scrolls.
(() => {
'use strict';
const DW = 1600, DH = 1000, TAU = Math.PI * 2;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------------------------------------------------------------- math
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const wrap = (v, a, b) => a + ((((v - a) % (b - a)) + (b - a)) % (b - a));
const bell = (x, c, w) => Math.exp(-(((x - c) / w) ** 2));
const qpt = (a, b, c, u) => { const v = 1 - u; return [v * v * a[0] + 2 * v * u * b[0] + u * u * c[0], v * v * a[1] + 2 * v * u * b[1] + u * u * c[1]]; };
const norm = (x, y) => { const l = Math.hypot(x, y) || 1; return [x / l, y / l]; };
function rng(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function noise(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; }
function fbm(x, o = 4) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * noise(x * f + i * 19.19); f *= 2.03; a *= 0.5; } return s; }

// ---------------------------------------------------------------- colour
const hexes = new Map();
function hex(h) {
  let c = hexes.get(h);
  if (!c) { const n = parseInt(h.slice(1), 16); c = [n >> 16 & 255, n >> 8 & 255, n & 255]; hexes.set(h, c); }
  return c;
}
function rgba(c, a = 1) { if (typeof c === 'string') c = hex(c); return `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`; }
function mix(a, b, t) { a = hex(a); b = hex(b); return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }

// ---------------------------------------------------------------- canvases and sprites
function canvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
const sprites = new Map();
function cached(key, make) { let c = sprites.get(key); if (!c) { c = make(); sprites.set(key, c); } return c; }

// soft round glow; `hard` adds a white-hot core
function glow(color, hard = 0) {
  return cached('g' + color + hard, () => {
    const c = canvas(128, 128), g = c.getContext('2d');
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    if (hard) {
      gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.1, rgba(color, 0.95));
      gr.addColorStop(0.28, rgba(color, 0.3)); gr.addColorStop(0.6, rgba(color, 0.07)); gr.addColorStop(1, rgba(color, 0));
    } else {
      gr.addColorStop(0, rgba(color, 1)); gr.addColorStop(0.2, rgba(color, 0.7)); gr.addColorStop(0.45, rgba(color, 0.25));
      gr.addColorStop(0.75, rgba(color, 0.06)); gr.addColorStop(1, rgba(color, 0));
    }
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    return c;
  });
}
function dot(g, x, y, r, color, a = 1, hard = 0) {
  if (a <= 0.004 || r <= 0) return;
  g.globalAlpha = Math.min(1, a); g.drawImage(glow(color, hard), x - r, y - r, r * 2, r * 2); g.globalAlpha = 1;
}
function oval(g, x, y, rx, ry, color, a = 1) {
  if (a <= 0.004) return;
  g.globalAlpha = Math.min(1, a); g.drawImage(glow(color), x - rx, y - ry, rx * 2, ry * 2); g.globalAlpha = 1;
}
// a long soft shaft of light
function raySprite(color) {
  return cached('r' + color, () => {
    const c = canvas(64, 512), g = c.getContext('2d');
    const h = g.createLinearGradient(0, 0, 64, 0);
    h.addColorStop(0, rgba(color, 0)); h.addColorStop(0.5, rgba(color, 1)); h.addColorStop(1, rgba(color, 0));
    g.fillStyle = h; g.fillRect(0, 0, 64, 512);
    g.globalCompositeOperation = 'destination-in';
    const v = g.createLinearGradient(0, 0, 0, 512);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(0.2, 'rgba(0,0,0,1)'); v.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = v; g.fillRect(0, 0, 64, 512);
    return c;
  });
}
function ray(c, x, y, theta, len, w, color, a) {
  c.save(); c.translate(x, y); c.rotate(theta - Math.PI / 2);
  c.globalAlpha = clamp(a, 0, 1); c.drawImage(raySprite(color), -w / 2, 0, w, len);
  c.restore();
}
// the lighthouse's wedge of light
function beamSprite() {
  return cached('beam', () => {
    const c = canvas(512, 128), g = c.getContext('2d');
    const gr = g.createLinearGradient(0, 0, 512, 0);
    gr.addColorStop(0, 'rgba(255,242,210,0.95)'); gr.addColorStop(0.25, 'rgba(255,236,196,0.45)'); gr.addColorStop(1, 'rgba(255,230,190,0)');
    g.filter = 'blur(5px)'; g.fillStyle = gr;
    g.beginPath(); g.moveTo(0, 60); g.lineTo(512, 10); g.lineTo(512, 118); g.lineTo(0, 68); g.closePath(); g.fill();
    return c;
  });
}

// ---------------------------------------------------------------- painting helpers (design units, 1600 x 1000)
function vgrad(g, y0, y1, stops) {
  const gr = g.createLinearGradient(0, y0, 0, y1);
  for (const [o, c, a = 1] of stops) gr.addColorStop(o, rgba(c, a));
  return gr;
}
function sky(g, y0, y1, stops) { g.fillStyle = vgrad(g, y0, y1, stops); g.fillRect(-600, -600, DW + 1200, DH + 1200); }
function ridge(fn, x0 = -600, x1 = DW + 600, bottom = DH + 600, step = 6) {
  const p = new Path2D(); p.moveTo(x0, bottom);
  for (let x = x0; x < x1; x += step) p.lineTo(x, fn(x));
  p.lineTo(x1, fn(x1)); p.lineTo(x1, bottom); p.closePath();
  return p;
}
function line(fn, x0, x1, step = 6) {
  const p = new Path2D(); p.moveTo(x0, fn(x0));
  for (let x = x0 + step; x < x1; x += step) p.lineTo(x, fn(x));
  p.lineTo(x1, fn(x1));
  return p;
}
function blobPath(x, y, rx, rnd, n = 9, ry = rx) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU + rnd() * 0.3, k = 0.75 + rnd() * 0.4;
    pts.push([x + Math.cos(a) * rx * k, y + Math.sin(a) * ry * k]);
  }
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const p = new Path2D(), m = mid(pts[n - 1], pts[0]);
  p.moveTo(m[0], m[1]);
  for (let i = 0; i < n; i++) { const q = pts[i], m2 = mid(q, pts[(i + 1) % n]); p.quadraticCurveTo(q[0], q[1], m2[0], m2[1]); }
  p.closePath();
  return p;
}
// clumps of leaves: a dark mass, then leaf dabs coloured by which side faces the light
function foliage(g, rnd, clumps, o) {
  const [lx, ly] = norm(o.lx ?? -0.4, o.ly ?? -0.7), amt = o.lightAmt ?? 0.5;
  for (const [x, y, r] of clumps) {
    g.fillStyle = o.dark; g.fill(blobPath(x, y, r, rnd, 10));
    const n = Math.round(12 + r * 0.55);
    for (let i = 0; i < n; i++) {
      const a = rnd() * TAU, d = Math.sqrt(rnd()) * r * 0.92, px = Math.cos(a) * d / r, py = Math.sin(a) * d / r;
      const lit = clamp(0.45 + 0.65 * (px * lx + py * ly) + (rnd() - 0.5) * 0.45, 0, 1);
      if (lit < 0.28) continue;
      const col = lit < 0.66 ? mix(o.dark, o.mid, (lit - 0.28) / 0.38) : mix(o.mid, o.light, Math.min(1, (lit - 0.66) / 0.34 * amt * 2));
      const sz = r * (0.1 + rnd() * 0.12);
      g.fillStyle = rgba(col, 0.88);
      g.beginPath(); g.ellipse(x + Math.cos(a) * d, y + Math.sin(a) * d, sz, sz * 0.62, rnd() * TAU, 0, TAU); g.fill();
    }
  }
}
function leafEdge(g, rnd, clumps, color, n, frac = 1) {
  g.fillStyle = color;
  for (const [x, y, r] of clumps) {
    if (rnd() > frac) continue;
    for (let i = 0; i < n; i++) {
      const a = rnd() * TAU, d = r * (0.85 + rnd() * 0.3);
      g.beginPath(); g.ellipse(x + Math.cos(a) * d, y + Math.sin(a) * d, 3 + rnd() * 6, 1.5 + rnd() * 2.5, a + rnd() - 0.5, 0, TAU); g.fill();
    }
  }
}
function trunkP(g, x0, y0, x1, y1, w0, w1, bend) {
  const mx = (x0 + x1) / 2 + bend, my = (y0 + y1) / 2, mw = (w0 + w1) / 4;
  g.beginPath(); g.moveTo(x0 - w0 / 2, y0); g.quadraticCurveTo(mx - mw, my, x1 - w1 / 2, y1);
  g.lineTo(x1 + w1 / 2, y1); g.quadraticCurveTo(mx + mw, my, x0 + w0 / 2, y0); g.closePath(); g.fill();
}
function pine(g, x, y, h, rnd) {
  g.strokeStyle = '#2a2a22'; g.lineWidth = Math.max(1.2, h * 0.025);
  g.beginPath(); g.moveTo(x, y); g.lineTo(x, y - h); g.stroke();
  const tiers = 6 + ((rnd() * 3) | 0);
  for (let k = 0; k < tiers; k++) {
    const ty = y - h * (0.22 + 0.78 * k / tiers), w = h * 0.24 * (1 - k / (tiers + 1)) * (0.8 + rnd() * 0.4);
    g.fillStyle = k % 2 ? '#24412c' : '#2e5034';
    g.beginPath(); g.ellipse(x, ty, w, h * 0.035, (rnd() - 0.5) * 0.15, 0, TAU); g.fill();
  }
}
// a standing figure, filled with the current fillStyle
function person(g, x, y, h, o = {}) {
  const w = h * 0.085;
  const f = pts => { g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.closePath(); g.fill(); };
  g.beginPath(); g.ellipse(x, y - h * 0.91, h * 0.058, h * 0.068, 0, 0, TAU); g.fill();
  f([x - h * 0.022, y - h * 0.86, x + h * 0.022, y - h * 0.86, x + h * 0.024, y - h * 0.79, x - h * 0.024, y - h * 0.79]);
  g.beginPath(); g.ellipse(x - w * 0.82, y - h * 0.785, w * 0.32, w * 0.26, 0, 0, TAU); g.ellipse(x + w * 0.82, y - h * 0.785, w * 0.32, w * 0.26, 0, 0, TAU); g.fill();
  f([x - w, y - h * 0.8, x + w, y - h * 0.8, x + w * 0.8, y - h * 0.47, x - w * 0.8, y - h * 0.47]);
  if (o.dress) f([x - w * 0.8, y - h * 0.55, x + w * 0.8, y - h * 0.55, x + w * 1.55, y - h * 0.17, x - w * 1.55, y - h * 0.17]);
  f([x - w * 0.78, y - h * 0.5, x - w * 0.04, y - h * 0.5, x - w * 0.2, y, x - w * 0.72, y]);
  f([x + w * 0.04, y - h * 0.5, x + w * 0.78, y - h * 0.5, x + w * 0.72, y, x + w * 0.2, y]);
  f([x - w, y - h * 0.8, x - w * 0.72, y - h * 0.72, x - w * 1.0, y - h * 0.47, x - w * 1.32, y - h * 0.5]);
  f([x + w, y - h * 0.8, x + w * 0.72, y - h * 0.72, x + w * 1.0, y - h * 0.47, x + w * 1.32, y - h * 0.5]);
}
function grassBlades(c, blades, t, color, wind = 1, width = 2) {
  c.strokeStyle = color; c.lineWidth = width; c.lineCap = 'round';
  c.beginPath();
  for (const b of blades) {
    const bend = (Math.sin(t * 1.1 * wind + b.x * 0.008 + b.ph) * 0.18 + 0.12) * b.h;
    c.moveTo(b.x, b.y); c.quadraticCurveTo(b.x + bend * 0.3, b.y - b.h * 0.6, b.x + bend, b.y - b.h);
  }
  c.stroke();
}

// ---------------------------------------------------------------- view and layers
let W = 0, H = 0, M = 0, sizeKey = 0;
let BV = null;                         // the view a scene is being painted for
function viewFor(sc) {
  const s = Math.max(W / DW, Math.min(H / DH, W / 680));   // portrait screens see a taller slice
  const f = (W / H < 0.9 && sc.focusP) ? sc.focusP : sc.focus;
  return { s, ox: (W - DW * s) * f[0], oy: (H - DH * s) * f[1] };
}
// a full-screen layer, with a margin so it can drift for parallax
function layer(fn) {
  const c = canvas(W + 2 * M, H + 2 * M), g = c.getContext('2d');
  g.setTransform(BV.s, 0, 0, BV.s, BV.ox + M, BV.oy + M);
  g.lineJoin = 'round';
  fn(g);
  return c;
}
// blur a finished canvas in one pass (much cheaper than blurring every stroke)
function blurred(src, px) {
  const c = canvas(src.width, src.height), g = c.getContext('2d');
  g.filter = `blur(${px.toFixed(2)}px)`; g.drawImage(src, 0, 0);
  return c;
}
// a design-sized sprite rendered at screen resolution
function sprite(w, h, fn) {
  const c = canvas(w * BV.s, h * BV.s), g = c.getContext('2d');
  g.scale(BV.s, BV.s); fn(g);
  return c;
}
function cloudSprite(rnd, w, h, o) {
  return sprite(w, h, g => {
    const n = 22 + Math.floor(rnd() * 10), puffs = [];
    for (let i = 0; i < n; i++) {
      const u = rnd(), bulge = Math.sin(Math.PI * u);

    for (const [x, y, r] of puffs) circ(x - r * 0.1, y + ly * r * 0.3, r * 0.66);
    g.fillStyle = rgba(o.rim || '#ffffff', 0.55);
    for (const [x, y, r] of puffs) if (rnd() < 0.4) circ(x - r * 0.14, y + ly * r * 0.5, r * 0.36);

    g.fillStyle = fade; g.fillRect(0, 0, w, h);
  });
}

const P = { x: 0, y: 0, tx: 0, ty: 0, last: -1e9 };
const V = {
  c: null, s: 1, ox: 0, oy: 0, sc: 0,
  off(d) { return [-P.x * 0.5 * d * M, (-P.y * 0.25 - this.sc * 0.6) * d * M]; },
  at(d) { const [dx, dy] = this.off(d); this.c.setTransform(this.s, 0, 0, this.s, this.ox + dx, this.oy + dy); },
  blit(img, d) {
    const [dx, dy] = this.off(d), c = this.c;
    c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
    c.drawImage(img, -M + dx, -M + dy);
  },
  sway(img, d, px, py, ang) {
    const [dx, dy] = this.off(d), c = this.c, X = this.ox + dx + px * this.s, Y = this.oy + dy + py * this.s;
    c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
    c.translate(X, Y); c.rotate(ang); c.translate(-X, -Y);
    c.drawImage(img, -M + dx, -M + dy);
  },
};

  new THREE.Color(0x2a78e0),
  new THREE.Color(0x1ba8c2),
  new THREE.Color(0x3653cc),
  new THREE.Color(0xf2ac4c),
];
function sectorOf(ang) {
  const rel = ((ang - SECTOR_STARTS[0]) % TAU + TAU) % TAU;
  return Math.floor(rel / (TAU / 4));
}
{
  const irisBucket = makeFacetBucket();
  const RINGS = 6, rings = [];
  for (let r = 0; r <= RINGS; r++) {
    const rad = PUPIL_R + (IRIS_R - PUPIL_R) * Math.pow(r / RINGS, 0.9);
    rings.push(ringPoints(() => rad, (r === 0 || r === RINGS) ? 0.012 : 0.05, 0.02));
  }
  const white = new THREE.Color(0xf2f8ff), sun = new THREE.Color(0xffd79a);
  const irisColor = (x, y) => {
    const sec = sectorOf(angOf(x, y));
    const frac = clamp((distOf(x, y) - PUPIL_R) / (IRIS_R - PUPIL_R), 0, 1);
    const c = SECTOR_COLORS[sec].clone();
    c.lerp(sun, 0.3 * Math.pow(1 - frac, 2.2));     // a ring of sunlight around the pupil
    c.lerp(white, 0.1 * (1 - frac));
    c.multiplyScalar(rand(0.62, 0.95) * (0.82 + 0.25 * (1 - frac)));
    if (Math.random() < 0.06) c.multiplyScalar(1.35);
    return c;
  };
  for (let r = 0; r < RINGS; r++) quadFill(irisBucket, rings[r], rings[r + 1], irisColor, delayByDist);
  const pupilColor = () => new THREE.Color(0x04070d).multiplyScalar(rand(0.7, 1.3));
  const midRing = ringPoints(() => PUPIL_R * 0.5, 0.03, 0.03);
  quadFill(irisBucket, midRing, rings[0], pupilColor, delayByDist);
  for (let s = 0; s < SEG; s++) pushTri(irisBucket, [0, 0], midRing[s], midRing[(s + 1) % SEG], pupilColor(), rand(0, 0.15));
  irisGroup.add(bucketToMesh(irisBucket, false));
}
// specular glints: a soft window of light, upper left
{
  const glint = makeFacetBucket();
  const gc = new THREE.Color(0xfff1dc);
  for (let i = 0; i < 6; i++) {
    const s = rand(0.10, 0.22), ox = -0.62 + rand(-0.16, 0.16), oy = 0.72 + rand(-0.12, 0.12);
    const a0 = rand(0, TAU);
    const tri = [0, 1, 2].map(k => [ox + s * Math.cos(a0 + k * 2.1), oy + s * Math.sin(a0 + k * 2.1)]);
    pushTri(glint, tri[0], tri[1], tri[2], gc.clone().multiplyScalar(rand(0.3, 0.6)), 0.9 + rand(0, 0.2));
  }
  for (let i = 0; i < 3; i++) {
    const s = rand(0.04, 0.08), ox = 0.7 + rand(-0.06, 0.06), oy = -0.62 + rand(-0.05, 0.05), a0 = rand(0, TAU);
    const tri = [0, 1, 2].map(k => [ox + s * Math.cos(a0 + k * 2.1), oy + s * Math.sin(a0 + k * 2.1)]);
    pushTri(glint, tri[0], tri[1], tri[2], new THREE.Color(0xbfe6ff).multiplyScalar(rand(0.3, 0.6)), 1.0);
  }
  irisGroup.add(bucketToMesh(glint, true));
}
// ---- sclera: misty teal-navy shards with a little warm light at the corners
{
  const scleraBucket = makeFacetBucket();
  const rings = [ringPoints(() => IRIS_R, 0.012, 0.02)];
  for (let r = 1; r <= 3; r++) {
    rings.push(ringPoints(a => IRIS_R + (almondR(a) - IRIS_R) * r / 3, r === 3 ? 0.015 : 0.16, r === 3 ? 0.004 : 0.02));
  }
  const nearC = new THREE.Color(0x1f4058), farC = new THREE.Color(0x0e1c2c);
  const mist = new THREE.Color(0x5b8fb0), ember = new THREE.Color(0x6e5a78);
  const scleraColor = (x, y) => {
    const a = angOf(x, y);
    const frac = clamp((distOf(x, y) - IRIS_R) / Math.max(0.001, almondR(a) - IRIS_R), 0, 1);
    const c = nearC.clone().lerp(farC, Math.pow(frac, 0.8));
    c.lerp(ember, 0.22 * Math.pow(Math.abs(x) / 4, 3));
    c.multiplyScalar(rand(0.75, 1.25));
    if (Math.random() < 0.05) c.lerp(mist, 0.5);
    return c;
  };
  for (let r = 0; r < 3; r++) quadFill(scleraBucket, rings[r], rings[r + 1], scleraColor, delayByDist);
  eyeRoot.add(bucketToMesh(scleraBucket, false));
}

// ---- glow line work
const BLUE_LINE = new THREE.Color(0x8fd4ff);
const AMBER_LINE = new THREE.Color(0xffc77a);
const DEEP_LINE = new THREE.Color(0x4a86c0);
const staticLines = (() => {
  const B = makeLineBucket();
  const outline = [];
  for (let i = 0; i <= 200; i++) { const a = i / 200 * TAU; outline.push([almondR(a) * Math.cos(a), almondR(a) * Math.sin(a)]); }
  pushPolyline(B, outline, DEEP_LINE, 0.9);
  for (const sx of [-1, 1]) {
    const cx = sx * EYE_W;
    pushPolyline(B, [[cx, 0], [cx + sx * 0.5, 0]], AMBER_LINE, 0.8);
    pushPolyline(B, [[cx + sx * 0.18, 0.22], [cx + sx * 0.42, 0.30]], DEEP_LINE, 0.6);
    pushPolyline(B, [[cx + sx * 0.18, -0.22], [cx + sx * 0.42, -0.30]], DEEP_LINE, 0.6);
  }
  return bucketToLines(B, 0.55);
})();
eyeRoot.add(staticLines);
const irisLines = (() => {
  const B = makeLineBucket();
  pushPolyline(B, circlePts(IRIS_R, 120), BLUE_LINE, 1.0);
  pushPolyline(B, circlePts(IRIS_R * 0.985, 120), BLUE_LINE, 0.4);
  pushPolyline(B, circlePts(PUPIL_R, 96), AMBER_LINE, 0.7);
  for (let i = 0; i < 4; i++) {
    const a = SECTOR_STARTS[i];
    pushPolyline(B, [[PUPIL_R * Math.cos(a), PUPIL_R * Math.sin(a)], [IRIS_R * Math.cos(a), IRIS_R * Math.sin(a)]], i === 3 ? AMBER_LINE : BLUE_LINE, 0.9);
  }
  for (let i = 0; i < 36; i++) {
    const a = i / 36 * TAU, r0 = IRIS_R * 0.90, r1 = IRIS_R * 0.965;
    pushPolyline(B, [[r0 * Math.cos(a), r0 * Math.sin(a)], [r1 * Math.cos(a), r1 * Math.sin(a)]], sectorOf(a) === 3 ? AMBER_LINE : BLUE_LINE, 0.55);
  }
  return bucketToLines(B, 1.0);
})();
irisGroup.add(irisLines);
const geoA = new THREE.Group(), geoB = new THREE.Group();
irisGroup.add(geoA); irisGroup.add(geoB);
geoA.add((() => {
  const B = makeLineBucket();
  pushPolyline(B, polygonPts(IRIS_R * 0.72, 6), BLUE_LINE, 0.8);
  pushPolyline(B, polygonPts(IRIS_R * 0.72, 6).map(p => [p[0] * 0.86, p[1] * 0.86]), DEEP_LINE, 0.5);
  return bucketToLines(B, 0.9);
})());
geoB.add((() => {
  const B = makeLineBucket();
  pushPolyline(B, polygonPts(PUPIL_R * 1.42, 3), AMBER_LINE, 0.85);
  pushPolyline(B, circlePts(PUPIL_R * 1.18, 64), BLUE_LINE, 0.4);
  return bucketToLines(B, 0.9);
})());

// halos: cool mist around the eye, a warm ember behind the iris
for (const [color, opacity, s, z] of [[0x2a5a7a, 0.3, 8.5, -0.4], [0xb07a3a, 0.14, 4.2, -0.3]]) {
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false }));
  halo.scale.set(s, s, 1);
  halo.position.z = z;
  eyeRoot.add(halo);
}

function fitEye() {
  const halfH = Math.tan(THREE.MathUtils.degToRad(20)) * 9.6;
  const halfW = halfH * camera.aspect;
  const s = Math.min(1, (halfW * 0.92) / 4.8, (halfH * 0.9) / 2.6);
  eyeRoot.scale.setScalar(s);
  return s;
}
let eyeScale = fitEye();

// ================================================================ state machine
let state = 'assemble', stateT = 0, uProg = 0, ffMode = false;
const fadeEl = document.getElementById('fade');
const mouse = { x: 0, y: 0 };
addEventListener('pointermove', e => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = (e.clientY / innerHeight) * 2 - 1;
});
const IDLE_LEN = 0.7, DIVE_LEN = 1.6;
function startDive() {
  if (state !== 'idle' && state !== 'assemble') return;
  state = 'dive'; stateT = 0;
}
addEventListener('pointerdown', startDive);
addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') startDive(); });
function onResize() {
  if (state === 'done') return;
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  eyeScale = fitEye();
}
addEventListener('resize', onResize);

function switchToSite() {
  state = 'done';
  Art.start({ instant: ffMode });
  removeEventListener('resize', onResize);
  // hand the GPU back
  setTimeout(() => {
    composer.dispose?.();
    renderer.dispose();
    renderer.forceContextLoss();
    renderer.domElement.remove();
  }, 60);
}

// ================================================================ loop
const clock = new THREE.Clock();
let elapsed = 0;
function step(dt) {
  if (state === 'done') return;
  elapsed += dt;
  stateT += dt;
  for (const m of timeMats) m.uniforms.uTime.value = elapsed;

  // assembly: triangles first, lines chase behind
  uProg = Math.min(uProg + dt / 0.6, 2.0);
  for (const m of facetMats) m.uniforms.uProg.value = uProg;
  const lp = smooth(clamp((uProg - 0.7) / 0.7, 0, 1));
  for (const m of lineMats) m.uniforms.uProg.value = lp;
  backMat.uniforms.uProg.value = smooth(clamp(uProg / 1.2, 0, 1));
  moteMat.uniforms.uProg.value = smooth(clamp((uProg - 0.2) / 1.2, 0, 1));

  if (state === 'assemble' && uProg >= 1.6) { state = 'idle'; stateT = 0; }
  if (state === 'idle' && stateT > IDLE_LEN) startDive();

  let speed = 1, diveT = 0;
  if (state === 'dive') { diveT = clamp(stateT / DIVE_LEN, 0, 1); speed = 1 + diveT * 6; }
  irisGroup.rotation.z += dt * 0.05 * speed;
  geoA.rotation.z -= dt * 0.14 * speed;
  geoB.rotation.z += dt * 0.22 * speed;
  // the eye breathes a little while it waits
  eyeRoot.scale.setScalar(eyeScale * (1 + 0.012 * Math.sin(elapsed * 1.3)));

  const track = 1 - (state === 'dive' ? smooth(clamp(diveT * 1.6, 0, 1)) : 0);
  irisGroup.position.x += ((mouse.x * 0.16 * track) - irisGroup.position.x) * Math.min(1, dt * 3);
  irisGroup.position.y += ((-mouse.y * 0.11 * track) - irisGroup.position.y) * Math.min(1, dt * 3);
  eyeRoot.rotation.y = mouse.x * 0.05 * track;
  eyeRoot.rotation.x = -mouse.y * 0.03 * track;

  if (state === 'dive') {
    const e = diveT * diveT * diveT;   // slow approach, fast plunge
    camera.position.z = 9.6 - (9.6 - 0.55 * eyeScale) * e;
    camera.position.x = irisGroup.position.x * eyeScale * e;
    camera.position.y = irisGroup.position.y * eyeScale * e;
    bloom.strength = 0.8 + diveT * 0.9;
    for (const m of lineMats) m.uniforms.uDim.value = 1 + diveT * 1.2;
    backMat.uniforms.uWarm.value = 0.9 * smooth(clamp((diveT - 0.55) / 0.45, 0, 1));
    const f = clamp((diveT - 0.7) / 0.28, 0, 1);
    fadeEl.style.opacity = String(f * f);
    if (diveT >= 1) switchToSite();
  }
}
function animate() {
  if (state === 'done') return;
  requestAnimationFrame(animate);
  step(Math.min(clock.getDelta(), 0.05));
  if (state !== 'done') composer.render();
}

// ?ff=N fast-forwards the timeline N seconds (used for automated screenshots)
{
  const ff = parseFloat(new URLSearchParams(location.search).get('ff'));
  if (ff > 0) {
    ffMode = true;
    for (let i = 0; i < Math.min(ff, 30) * 60 && state !== 'done'; i++) step(1 / 60);
  }
}
animate();
}
</script>
